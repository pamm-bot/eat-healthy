{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
{% get_available_languages as LANGUAGES %}
<form action="{% url 'set_language' %}" method="post" class="locale-switch"
      role="group" aria-label="{% trans 'Language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.path }}">
  {% for code, name in LANGUAGES %}
    <button type="submit" name="language" value="{{ code }}"
            class="locale-flag{% if code == CURRENT_LANGUAGE %} is-active{% endif %}"
            title="{{ name }}" aria-label="{{ name }}"
            {% if code == CURRENT_LANGUAGE %}aria-current="true"{% endif %}>
      {% if code == "en" %}
        <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <clipPath id="en-a"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
          <clipPath id="en-b"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <g clip-path="url(#en-a)">
            <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#en-b)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </g>
        </svg>
      {% elif code == "it" %}
        <svg viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="1" height="2" x="0" fill="#009246"/>
          <rect width="1" height="2" x="1" fill="#fff"/>
          <rect width="1" height="2" x="2" fill="#CE2B37"/>
        </svg>
      {% elif code == "fr" %}
        <svg viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="1" height="2" x="0" fill="#0055A4"/>
          <rect width="1" height="2" x="1" fill="#fff"/>
          <rect width="1" height="2" x="2" fill="#EF4135"/>
        </svg>
      {% endif %}
    </button>
  {% endfor %}
</form>
